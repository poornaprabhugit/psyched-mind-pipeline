name: channel-research
on:
  push:
    branches: [main]
    paths: ["jobs/research/*.json"]
permissions:
  contents: write
concurrency:
  group: research
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Collect public channel data
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          for f in $(git diff --name-only HEAD~1 HEAD -- 'jobs/research/*.json'); do
            n=$(basename "$f" .json)
            python scripts/channel_research.py "$f" "research/$n.json" 2>&1 | tee -a research_log.txt
          done
      - name: Commit
        if: always()
        run: |
          mkdir -p research; cp research_log.txt research/last_run_log.txt 2>/dev/null || true
          git config user.name "pipeline-bot"; git config user.email "pipeline@users.noreply.github.com"
          git add research
          git commit -qm "research $(date -u +%F)" || exit 0
          git pull -q --rebase origin main && git push -q origin HEAD:main
