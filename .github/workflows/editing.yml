name: editing-study
on:
  push:
    branches: [main]
    paths: ["jobs/editing/*.json"]
permissions:
  contents: write
concurrency:
  group: editing
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install tools
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q -U "yt-dlp[default]"
          yt-dlp --version
      - name: Measure videos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          for f in $(git diff --name-only HEAD~1 HEAD -- 'jobs/editing/*.json'); do
            n=$(basename "$f" .json)
            python scripts/editing_study.py "$f" "research/editing/$n" 2>&1 | tee -a editing_log.txt
          done
      - name: Commit
        if: always()
        run: |
          mkdir -p research/editing; cp editing_log.txt research/editing/last_run_log.txt 2>/dev/null || true
          git config user.name "pipeline-bot"; git config user.email "pipeline@users.noreply.github.com"
          git add research/editing
          git commit -qm "editing study $(date -u +%F)" || exit 0
          git pull -q --rebase origin main && git push -q origin HEAD:main
