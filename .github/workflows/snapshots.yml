name: shorts-snapshots
# Checkpoint snapshots of each Short at ~3 h, ~24 h and ~7 days (user decision 19 Nov 2026).
# Two short runs a day (~60 Actions minutes/month). Times are UTC (Amsterdam winter = UTC+1):
# 14:10 UTC = 15:10 Amsterdam (12:00 Short at ~3 h), 18:10 UTC = 19:10 Amsterdam (16:00 Short at ~3 h).
# If the slots change, move these times to slot + ~3 h.
on:
  schedule:
    - cron: "10 14 * * *"
    - cron: "10 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Take snapshots
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/snapshots.py memory/stats/snapshots.csv
      - name: Commit
        run: |
          git config user.name "pipeline-bot"; git config user.email "pipeline@users.noreply.github.com"
          git add memory/stats/snapshots.csv 2>/dev/null || exit 0
          git commit -qm "snapshots $(date -u +%F' '%H:%M)" || exit 0
          git pull -q --rebase origin main && git push -q origin HEAD:main
