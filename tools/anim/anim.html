<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
window.TALK=0;const C={bg:'#17143A',bg2:'#221E52',ink:'#F6F1E7',dim:'#8F8AB8',yel:'#FFC94D',cor:'#FF6B6B',grn:'#3DDC97',blu:'#7C83FD',pnk:'#FF9EC7',brn:'#8A5A3B',gold:'#E8B13A'};
const F='"DejaVu Sans", "Liberation Sans", Arial, sans-serif';

// ---------- easing / helpers ----------
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const mix=(a,b,k)=>a+(b-a)*k;
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function txt(s,x,y,size,col,align='center',weight='bold'){ctx.font=`${weight} ${size}px ${F}`;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function bg(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.bg2);g.addColorStop(1,C.bg);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // soft floor
  ctx.fillStyle='rgba(255,255,255,0.04)';ctx.fillRect(0,1180,W,8);
}

// ---------- the character: "Pip", an original round bean ----------
// opts: x,y (feet center), s scale, col, mood ('happy','sad','shock','meh','calm'), arms [lAngle,rAngle], walk phase, blink, look (-1..1)
function pip(o){
  const s=o.s||1, col=o.col||C.blu;
  ctx.save();ctx.translate(o.x,o.y);ctx.scale(s*(o.flip?-1:1),s);
  const step=o.walk!=null?Math.sin(o.walk*Math.PI*2):0;
  const bob=o.walk!=null?Math.abs(Math.sin(o.walk*Math.PI*2))*6:0;
  // legs
  ctx.strokeStyle=C.ink;ctx.lineWidth=14;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-28,-70);ctx.lineTo(-28+step*18,0);ctx.moveTo(28,-70);ctx.lineTo(28-step*18,0);ctx.stroke();
  ctx.translate(0,-bob);
  // arms
  const arm=(sx,ang)=>{ctx.beginPath();ctx.moveTo(sx,-170);ctx.lineTo(sx+Math.sin(ang)*85,-170+Math.cos(ang)*85);ctx.stroke();
    ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(sx+Math.sin(ang)*85,-170+Math.cos(ang)*85,11,0,7);ctx.fill();};
  const a=o.arms||[0.35,-0.35];
  arm(-70,-a[0]);arm(70,-a[1]);
  // body
  ctx.fillStyle=col;rr(-80,-300,160,240,80);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.18)';rr(-58,-280,40,90,20);ctx.fill();
  // face
  const lk=(o.look||0)*10;
  const bl=o.blink?0.12:1;
  ctx.fillStyle='#fff';
  const ey=-220;
  const er=o.mood==='shock'?24:20;
  ctx.beginPath();ctx.ellipse(-28+lk,ey,er,er*bl,0,0,7);ctx.ellipse(28+lk,ey,er,er*bl,0,0,7);ctx.fill();
  ctx.fillStyle='#1a1630';
  ctx.beginPath();ctx.ellipse(-26+lk*1.4,ey+2,10,10*bl,0,0,7);ctx.ellipse(30+lk*1.4,ey+2,10,10*bl,0,0,7);ctx.fill();
  ctx.strokeStyle='#1a1630';ctx.lineWidth=7;
  if(o.palm){ctx.strokeStyle=C.ink;ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(70,-170);ctx.lineTo(18,-226);ctx.stroke();
    ctx.fillStyle=C.ink;ctx.beginPath();ctx.ellipse(10,-228,20,15,-0.6,0,7);ctx.fill();}
  const m=o.mood||'calm';ctx.beginPath();
  if(o.talk>0.06){ctx.fillStyle='#1a1630';ctx.beginPath();ctx.ellipse(lk,-176,13+o.talk*5,3+o.talk*17,0,0,7);ctx.fill();
    ctx.fillStyle='#FF7F9A';ctx.beginPath();ctx.ellipse(lk,-176+(3+o.talk*17)*0.45,7+o.talk*3,1.5+o.talk*5,0,0,7);ctx.fill();ctx.restore();return;}
  if(m==='happy'){ctx.arc(lk,-185,22,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
  else if(m==='sad'){ctx.arc(lk,-160,20,1.2*Math.PI,1.8*Math.PI);ctx.stroke();
    ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-48+lk,-252);ctx.lineTo(-14+lk,-246);ctx.moveTo(48+lk,-252);ctx.lineTo(14+lk,-246);ctx.stroke();}
  else if(m==='shock'){ctx.fillStyle='#1a1630';ctx.beginPath();ctx.ellipse(lk,-170,12,16,0,0,7);ctx.fill();}
  else if(m==='meh'){ctx.moveTo(-16+lk,-172);ctx.lineTo(18+lk,-176);ctx.stroke();
    ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-46+lk,-250);ctx.lineTo(-12+lk,-250);ctx.moveTo(46+lk,-254);ctx.lineTo(12+lk,-248);ctx.stroke();}
  else {ctx.arc(lk,-180,14,0.2*Math.PI,0.8*Math.PI);ctx.stroke();}
  ctx.restore();
}

// ---------- props ----------
function bill(x,y,rot,s=1,label='$10'){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.fillStyle=C.grn;rr(-90,-48,180,96,12);ctx.fill();ctx.strokeStyle='#1d7a52';ctx.lineWidth=6;rr(-78,-36,156,72,8);ctx.stroke();
  txt(label,0,2,46,'#0f3b28');ctx.restore();}
function ticket(x,y,rot,s=1,label='$10'){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.fillStyle=C.yel;ctx.beginPath();ctx.moveTo(-100,-50);ctx.lineTo(100,-50);ctx.lineTo(100,-14);ctx.arc(100,0,14,-Math.PI/2,Math.PI/2,true);ctx.lineTo(100,50);ctx.lineTo(-100,50);ctx.lineTo(-100,14);ctx.arc(-100,0,14,Math.PI/2,-Math.PI/2,true);ctx.closePath();ctx.fill();
  ctx.setLineDash([8,8]);ctx.strokeStyle='#a87b12';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(40,-42);ctx.lineTo(40,42);ctx.stroke();ctx.setLineDash([]);
  txt('SHOW',-30,-14,26,'#5a3f05');txt(label,-30,22,34,'#5a3f05');ctx.restore();}
function tag(x,y,rot,s,label,col=C.ink,fg='#1a1630'){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-70,-44);ctx.lineTo(70,-44);ctx.lineTo(70,44);ctx.lineTo(-70,44);ctx.lineTo(-100,0);ctx.closePath();ctx.fill();
  ctx.fillStyle=C.bg;ctx.beginPath();ctx.arc(-72,0,9,0,7);ctx.fill();
  txt(label,8,3,44,fg);ctx.restore();}
function mark(x,y,ok,k){if(k<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(back(k),back(k));
  ctx.fillStyle=ok?C.grn:C.cor;ctx.beginPath();ctx.arc(0,0,48,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();
  if(ok){ctx.moveTo(-20,2);ctx.lineTo(-5,18);ctx.lineTo(22,-16);}else{ctx.moveTo(-17,-17);ctx.lineTo(17,17);ctx.moveTo(17,-17);ctx.lineTo(-17,17);}
  ctx.stroke();ctx.restore();}
function booth(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#3a3378';rr(-90,-260,180,260,14);ctx.fill();ctx.fillStyle=C.cor;rr(-105,-300,210,60,14);ctx.fill();
  txt('TICKETS',0,-270,30,'#fff');ctx.fillStyle='#1a1630';rr(-55,-200,110,80,10);ctx.fill();ctx.restore();}
function truffle(x,y,s=1,sad=0){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=C.gold;ctx.beginPath();ctx.moveTo(-70,-20);ctx.lineTo(-120,-60);ctx.lineTo(-115,30);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(70,-20);ctx.lineTo(120,-60);ctx.lineTo(115,30);ctx.closePath();ctx.fill();
  const g=ctx.createRadialGradient(-25,-30,10,0,0,90);g.addColorStop(0,'#FFE08A');g.addColorStop(1,'#C98A14');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,80,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=4;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*22-10,-70);ctx.lineTo(i*22+10,70);ctx.stroke();}
  // tiny face
  ctx.fillStyle='#5a3f05';ctx.beginPath();ctx.arc(-22,-6,7,0,7);ctx.arc(22,-6,7,0,7);ctx.fill();
  ctx.strokeStyle='#5a3f05';ctx.lineWidth=5;ctx.beginPath();
  if(sad>.5)ctx.arc(0,34,14,1.2*Math.PI,1.8*Math.PI);else ctx.arc(0,14,14,0.2*Math.PI,0.8*Math.PI);ctx.stroke();
  ctx.restore();}
function choc(x,y,s=1,happy=0){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=C.brn;rr(-75,-60,150,120,12);ctx.fill();ctx.fillStyle='#6b4229';
  for(let i=0;i<3;i++)for(let j=0;j<2;j++){rr(-62+i*44,-48+j*52,36,44,6);ctx.fill();}
  ctx.fillStyle='#f4e3d0';ctx.beginPath();ctx.arc(-20,-4,7,0,7);ctx.arc(20,-4,7,0,7);ctx.fill();
  ctx.strokeStyle='#f4e3d0';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,12,12+happy*4,0.2*Math.PI,0.8*Math.PI);ctx.stroke();
  ctx.restore();}
function stamp(x,y,word,k,col=C.cor,size=110,rot=-0.18){if(k<=0)return;const sc=mix(2.2,1,eo(cl(k*1.6)));
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);ctx.globalAlpha=cl(k*3);
  ctx.font=`900 ${size}px ${F}`;const w=ctx.measureText(word).width;
  ctx.strokeStyle=col;ctx.lineWidth=10;rr(-w/2-28,-size*0.62,w+56,size*1.24,18);ctx.stroke();
  txt(word,0,4,size,col,'center','900');ctx.restore();}
function grid(x,y,n,col,k,cols=10,size=46,gap=14){ // 100 dots, first n lit
  for(let i=0;i<100;i++){const r=Math.floor(i/cols),c=i%cols;
    const lit=i<n*cl(k*1.05);
    ctx.fillStyle=lit?col:'rgba(255,255,255,0.12)';
    const px=x+c*(size+gap),py=y+r*(size+gap);
    ctx.beginPath();ctx.arc(px+size/2,py+size*0.28,size*0.22,0,7);ctx.fill();
    rr(px+size*0.18,py+size*0.5,size*0.64,size*0.5,size*0.25);ctx.fill();}}

// ---------- captions (word-by-word) ----------
function captions(lines,t){
  const ch=[];for(const [a,b,str] of lines){const w=str.split(' ');const n=Math.ceil(w.length/5);const per=(b-a)/w.length;let i=0;
    for(let c=0;c<n;c++){const k=Math.ceil((w.length-i)/(n-c));ch.push([a+i*per,a+(i+k)*per,w.slice(i,i+k).join(' ')]);i+=k;}}
  let cur=null;for(const L of ch)if(t>=L[0]&&t<L[1])cur=L;
  if(!cur)return;
  const [a,b,s]=cur;const words=s.split(' ');
  const per=(b-a)/words.length;
  ctx.font=`900 72px ${F}`;
  // wrap into lines of max width 900
  const rows=[];let row=[];
  for(const w of words){const test=[...row,w].join(' ');if(ctx.measureText(test).width>900&&row.length){rows.push(row);row=[w];}else row.push(w);}
  rows.push(row);
  let idx=0;const y0=1420-(rows.length-1)*41;
  rows.forEach((r,ri)=>{const full=r.join(' ');const tw=ctx.measureText(full).width;let x=W/2-tw/2;
    for(const w of r){const ws=a+idx*per;const on=t>=ws;const pop=on?eo(cl((t-ws)/0.12)):0;
      const ww=ctx.measureText(w+' ').width;
      ctx.save();ctx.translate(x+ctx.measureText(w).width/2,y0+ri*82);ctx.scale(1+0.08*(1-pop)*(on?1:0),1);
      ctx.lineWidth=14;ctx.strokeStyle='rgba(10,8,30,0.85)';ctx.lineJoin='round';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeText(w,0,0);ctx.fillStyle=on?(idx===Math.floor((t-a)/per)?C.yel:C.ink):'rgba(246,241,231,0.35)';ctx.fillText(w,0,0);
      ctx.restore();x+=ww;idx++;}
  });
}
function hook(text,t,until){ if(t>until)return;const k=eo(lin(t,0,0.25))*(1-lin(t,until-0.25,until));
  ctx.save();ctx.globalAlpha=k;ctx.translate(W/2,300);ctx.scale(mix(0.9,1,k),mix(0.9,1,k));
  let fs=64;ctx.font=`900 ${fs}px ${F}`;while(ctx.measureText(text).width>900){fs-=2;ctx.font=`900 ${fs}px ${F}`;}const tw=ctx.measureText(text).width;
  ctx.fillStyle='#fff';rr(-tw/2-40,-70,tw+80,140,28);ctx.fill();
  txt(text,0,4,fs,'#17143A','center','900');ctx.restore();}
function brand(){txt('THE PSYCHED MIND',W/2,130,30,'rgba(246,241,231,0.35)','center','bold');}

// =================== VIDEO 1: LOST TICKET ===================
const V1={dur:19.8, hook:'Lost $10 cash vs lost $10 ticket',
 lines:[[0,3.0,'Lose ten dollars, and you still buy the ticket.'],[3.0,5.0,"Lose the ticket, and you don't."],
  [5.0,8.2,'Lost a ten-dollar bill on the way to the theater?'],[8.2,10.8,'Eighty-eight percent still bought a ticket.'],
  [10.8,12.8,'Lost the ten-dollar ticket itself?'],[12.8,15.2,'Only forty-six percent bought another.'],
  [15.2,16.1,'Same money.'],[16.1,19.2,'But your brain says the show now costs twenty.'],[19.2,19.8,'So:']],
 draw(t){
  bg();
  if(t<5.0){ // two big comedy beats
    const cashS=t<3.0;
    const cam= cashS? 1+0.12*eio(lin(t,0.9,1.4))-0.12*eio(lin(t,1.9,2.3)) : 1+0.14*eio(lin(t,4.1,4.35));
    const fx=cashS?420:480, fy=1000;
    ctx.save();ctx.translate(fx,fy);ctx.scale(cam,cam);ctx.translate(-fx,-fy);
    if(cashS){
      txt('LOST $10 CASH',W/2,520,58,C.grn,'center','900');
      booth(860,1180,1.0);
      const wk=lin(t,1.9,2.6);const x=mix(400,640,eio(wk));
      // bill slips and whooshes away
      const bf=lin(t,0.05,0.9);
      if(t<0.95){bill(x+120-bf*700+Math.sin(t*14)*25, 900-bf*420+Math.sin(t*9)*30, Math.sin(t*11)*0.8, 0.85);}
      let arms=[0.35,-2.0],mood='calm',look=0;
      if(t<0.9){arms=[1.7,-1.7];mood='shock';look=-1;}
      else if(t<1.5){arms=[0.25,-0.25];mood='meh';look=0;}          // deadpan stare at you
      else if(t<1.9){const w=Math.sin((t-1.5)*24)*0.2;arms=[2.1+w,-2.1-w];mood='meh';} // big shrug
      else {mood='happy';arms=[0.35,-0.35];look=0.6;}
      pip({x,y:1180,s:1.5,col:C.blu,mood,arms,look,walk:wk>0&&wk<1?t*1.7:null,blink:t>1.0&&t<1.08});
      const tk=eo(lin(t,2.45,2.7));
      if(tk>0){ticket(x+150,760-tk*40,0.15,0.9*back(tk));}
      mark(W/2,640,true,lin(t,2.6,2.9));
    } else {
      txt('LOST $10 TICKET',W/2,520,58,C.yel,'center','900');
      booth(880,1180,1.0);
      const x=480;
      const tf=lin(t,3.3,3.75);
      if(t<3.3){ticket(x+150,790,-0.2,0.9);}
      else if(tf<1){ticket(x+150+tf*420,mix(790,1150,tf*tf),-0.2+tf*5,0.9);}
      let arms=[0.35,-2.3],mood='happy',look=0.4;
      if(t>=3.3&&t<3.65){arms=[1.6,-1.6];mood='shock';look=1;}
      else if(t>=3.65&&t<4.1){const p=Math.sin((t-3.65)*42);arms=[0.9+p*0.6,-0.9+p*0.6];mood='shock';look=0;} // pat-pat-pat
      else if(t>=4.1){arms=[0.5,-0.5];mood='sad';look=0;}
      pip({x,y:1180,s:1.5,col:C.pnk,mood,arms,look,blink:t>4.5&&t<4.57});
      const pk=eo(lin(t,4.1,4.25));
      if(pk>0){ctx.save();ctx.fillStyle='#F6F1E7';
        [-1,1].forEach(d=>{const pd=lin(t,d<0?4.1:4.2,d<0?4.2:4.3);if(pd<=0)return;ctx.save();ctx.translate(x+d*76*1.5,1180-100*1.5);ctx.rotate(d*(0.3+Math.sin(t*12)*0.1));ctx.scale(back(pd),back(pd));
          ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(d*62,-18);ctx.lineTo(d*55,36);ctx.lineTo(0,26);ctx.closePath();ctx.fill();ctx.strokeStyle='#C9666B';ctx.lineWidth=5;ctx.stroke();ctx.restore();});
        const dp=lin(t,4.3,4.9);if(dp>0&&dp<1){ctx.globalAlpha=1-dp;ctx.fillStyle='#B9B4E0';
          for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(x+150+i*20+dp*40,1000-dp*80-i*10,10+dp*12,0,7);ctx.fill();}}
        ctx.restore();}
      mark(W/2,640,false,lin(t,4.5,4.8));
    }
    ctx.restore();
  } else if(t<15.2){
    const cash=t<10.8, a=cash?5.0:10.8;
    const k=lin(t,a+(cash?3.2:2.0),a+(cash?3.8:2.6));
    const enter=eo(lin(t,a,a+0.4));
    ctx.save();ctx.globalAlpha=enter;
    if(cash){bill(260,520,-0.1,0.9);txt('Lost $10 cash',650,520,50,C.ink);}
    else{ticket(260,520,-0.1,0.9);txt('Lost $10 ticket',650,520,50,C.ink);}
    grid(110,640,cash?88:46,cash?C.grn:C.cor,k,10,42,10);
    const n=Math.round((cash?88:46)*eo(k));
    ctx.restore();
    // big counter beside caption area (above caption)
    if(k>0){ctx.save();ctx.globalAlpha=cl(k*4);txt(n+'%',840,860,150,cash?C.grn:C.cor,'center','900');txt(cash?'still bought':'bought again',840,970,40,C.ink);ctx.restore();}
    {const done=k>=1;const hop=cash&&done?Math.abs(Math.sin((t-(a+3.8))*9))*30*Math.max(0,1-(t-(a+3.8))/1.2):0;
     const arms=cash?(done?[0.4,-2.8]:[0.35,-0.35]):[0.35,-0.35];
     pip({x:160,y:1262-hop,s:0.78,col:C.blu,mood:cash?(done?'happy':'calm'):(done?'sad':'calm'),look:0.6,arms,palm:!cash&&done,blink:Math.abs((t%3.3)-1.6)<0.06});}
    if(!cash){ // remember 88%
      ctx.save();ctx.globalAlpha=0.9*enter;txt('cash: 88%',840,1060,40,C.grn);ctx.restore();}
  } else {
    const a=15.2;
    // "Same money" : bill = ticket
    const k1=eo(lin(t,a,a+0.4));
    const shift=eio(lin(t,16.1,16.6));
    ctx.save();ctx.globalAlpha=1-shift*0.85;
    bill(320,620,0,1.1*k1);ticket(760,620,0,1.1*k1);txt('=',540,620,110,C.ink);
    ctx.restore();
    // character thinking with ticket price flipping
    pip({x:300,y:1180,s:1.2,col:C.pnk,mood:t<17.6?'calm':(t<18.4?'shock':'meh'),arms:t<17.9?[0.35,-2.3]:[1.1,-0.35],look:t<18.4?0.7:0,blink:Math.abs(t-16.9)<0.06||Math.abs(t-18.9)<0.06,talk:TALK});
    const tb=eo(lin(t,16.3,16.8));
    if(tb>0){ctx.save();ctx.globalAlpha=tb;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(390,900,14,0,7);ctx.arc(430,850,22,0,7);ctx.fill();
      rr(470,640,520,300,60);ctx.fill();
      txt('THE SHOW',730,700,40,'#17143A');
      const flip=lin(t,17.5,17.75);
      ctx.save();ctx.translate(730,820);ctx.scale(1,Math.abs(Math.cos(flip*Math.PI)));
      txt(flip<0.5?'$10':'$20',0,6,130,flip<0.5?'#17143A':C.cor,'center','900');ctx.restore();
      ctx.restore();}
    const wo=lin(t,17.9,18.1);
    if(wo>0){ctx.save();ctx.translate(205,1000);ctx.rotate(-0.2);ctx.scale(1.3,1.3);
      ctx.fillStyle='#8A5A3B';rr(-40,-26,80,52,8);ctx.fill();
      ctx.fillStyle='#6b4229';ctx.save();ctx.translate(0,-26);ctx.rotate(-1.2*eo(wo));rr(-40,-46,80,46,8);ctx.fill();ctx.restore();ctx.restore();
      const mf=lin(t,18.05,19.8);if(mf>0&&mf<1){const ang=mf*Math.PI*3.2,rad=40+mf*110;const mx=300+Math.cos(ang)*rad,my=880-mf*120+Math.sin(ang)*rad*0.5,fl=Math.abs(Math.sin(t*28));
        ctx.save();ctx.translate(mx,my);ctx.scale(1.8,1.8);ctx.fillStyle='#CFC6B8';
        ctx.beginPath();ctx.ellipse(-9,0,12,6+fl*6,0.5,0,7);ctx.ellipse(9,0,12,6+fl*6,-0.5,0,7);ctx.fill();
        ctx.fillStyle='#6E6556';ctx.beginPath();ctx.ellipse(0,0,4,9,0,0,7);ctx.fill();ctx.restore();}}
  }
  hook(V1.hook,t,2.4);
  if(window.SYNC&&SYNC.on)captionsW(SYNC.words,SYNC.tv);else captions(V1.lines,t);brand();
 }};

// =================== VIDEO 2: FREE CHOCOLATE ===================
const V2={dur:18.6, hook:'Luxury truffle vs FREE chocolate',
 lines:[[0,3.9,'Make the cheap chocolate free, and people stop buying the fancy one.'],
  [3.9,8.2,'Researchers sold a fancy truffle for fifteen cents, a cheap chocolate for one.'],[8.2,9.7,'Most bought the truffle.'],
  [9.7,11.7,'Then both got one cent cheaper.'],[11.7,13.4,'Fourteen cents, or free.'],[13.4,15.2,'Most grabbed the free one.'],
  [15.2,17.4,'Free feels better than any discount.'],[17.4,18.6,"That's why, if you"]],
 draw(t){
  bg();
  // counter
  ctx.fillStyle='#2E2868';rr(60,820,960,40,14);ctx.fill();
  const TX=300,CX=780;
  // crowd: 4 pips; target side per time
  // phase: 0-3.9 intro (free sticker on chocolate, crowd walks to free); 3.9-9.7 tags 15c/1c, crowd to truffle; 9.7-15.2 price drop, crowd to free
  let side; // 0 = truffle, 1 = free
  let move;
  if(t<3.9){side=1;move=eio(lin(t,1.2,2.8));}
  else if(t<9.7){side=0;move=eio(lin(t,8.2,9.4));}
  else {side=1;move=eio(lin(t,13.4,14.8));}
  const sadT = (t<3.9&&t>1.6)||(t>14.2&&t<15.2);
  truffle(TX,700,1.15+0.04*Math.sin(t*3),sadT?1:0);
  choc(CX,720,1.25,side===1&&move>0.5?1:0);
  // tags
  if(t>=3.9&&t<15.2){
    const ti=back(cl(lin(t,4.6,5.1)));const ci=back(cl(lin(t,6.6,7.1)));
    const drop=lin(t,10.2,10.6), fr=lin(t,12.1,12.5);
    if(ti>0)tag(TX+40,500,-0.08,ti,drop<0.5?'15¢':'14¢',C.ink);
    if(ci>0&&fr<0.5)tag(CX+40,500,0.08,ci,'1¢',C.ink);
    if(drop>0&&drop<1){txt('−1¢',TX+40,400-drop*60,48,`rgba(255,107,107,${1-drop})`);txt('−1¢',CX+40,400-drop*60,48,`rgba(255,107,107,${1-drop})`);}
    stamp(CX+30,500,'FREE',fr,C.grn,90,0.12);
  }
  if(t<3.9) stamp(CX+30,500,'FREE',lin(t,0.6,1.0),C.grn,90,0.12);
  // crowd
  const cols=[C.blu,C.pnk,C.yel,'#5FD3F3'];
  const home=[150,380,640,900];
  // where each goes: majority (3) to side, 1 to other side
  for(let i=0;i<4;i++){
    const minority=(i===3);
    const prevSide = (t<3.9)?null:(t<9.7?1:0);
    const tgt=(minority?1-side:side);
    const tgtX=(tgt===0?TX:CX)+(i-1.5)*105+(minority?0:0);
    let fromX = home[i];
    if(t>=9.7){fromX=( (i===3?1:0)===0?TX:CX)+(i-1.5)*105;}
    if(t>=3.9&&t<9.7){fromX=home[i];}
    const x=mix(fromX,tgtX,move);
    const walking=move>0.02&&move<0.98;
    const mood = move>0.95 ? (tgt===1&&side===1&&!minority?'happy':(tgt===0&&side===0?'happy':'calm')) : (walking?'calm':'calm');
    pip({x, y:1180+(i%2)*20, s:0.62, col:cols[i], mood, walk:walking?t*1.8+i*0.3:null, look:tgtX>x?0.7:-0.7, blink:Math.abs(((t+i*0.7)%3.1)-1.5)<0.05,talk:i===0?TALK:0});
  }
  // finale: FREE vs discount
  if(t>=15.2){
    const k=eo(lin(t,15.2,15.6));
    ctx.save();ctx.globalAlpha=k;ctx.fillStyle=C.bg;ctx.fillRect(0,380,W,880);ctx.restore();
    const g=back(cl(lin(t,15.3,15.9)));
    ctx.save();ctx.translate(W/2,700);ctx.scale(g,g);
    ctx.shadowColor=C.grn;ctx.shadowBlur=60;txt('FREE',0,0,230,C.grn,'center','900');ctx.restore();
    const d=lin(t,16.0,17.2);
    ['−10%','−1¢','−50%'].forEach((s,i)=>{const kk=eo(cl(d*1.5-i*0.25));if(kk<=0)return;
      ctx.save();ctx.globalAlpha=mix(1,0.45,kk);txt(s,220+i*320,1000+ (i===1?40:0),mix(30,60,kk),C.dim,'center','900');ctx.restore();});
    pip({x:150,y:1262,s:0.5,col:C.blu,mood:'happy',look:0.6,talk:TALK});
  }
  hook(V2.hook,t,2.4);
  if(window.SYNC&&SYNC.on)captionsW(SYNC.words,SYNC.tv);else captions(V2.lines,t);brand();
 }};

window.VIDS={V1,V2};
window.drawAt=(v,t)=>{VIDS[v].draw(t);return true;};
window.grab=(v,t)=>{VIDS[v].draw(t);return cv.toDataURL('image/jpeg',0.92);};

// ---- voice sync: captions from real word timings, scenes mapped line-by-line ----
function chunksFrom(words,lines){
  const out=[];let k=0;
  for(const L of lines){const n=L[2].split(' ').length;const lw=words.slice(k,k+n);
    const disp=L[2].split(' ');const m=Math.ceil(n/5);let i=0;
    for(let c=0;c<m;c++){const take=Math.ceil((n-i)/(m-c));out.push({ws:lw.slice(i,i+take).map((w,j)=>({t:w.start,s:disp[i+j]}))});i+=take;}
    k+=n;}
  for(let i=0;i<out.length;i++){out[i].a=i?out[i].ws[0].t-0.05:0;out[i].b=i<out.length-1?out[i+1].ws[0].t-0.05:1e9;}
  return out;}
function captionsW(ch,t){
  const cur=ch.find(c=>t>=c.a&&t<c.b);if(!cur)return;
  ctx.font=`900 72px ${F}`;
  const words=cur.ws;const rows=[];let row=[];
  for(const w of words){const test=[...row,w].map(x=>x.s).join(' ');if(ctx.measureText(test).width>900&&row.length){rows.push(row);row=[w];}else row.push(w);}
  rows.push(row);
  let lastOn=-1;words.forEach((w,i)=>{if(t>=w.t)lastOn=i;});
  let idx=0;const y0=1420-(rows.length-1)*41;
  rows.forEach((r,ri)=>{const tw=ctx.measureText(r.map(x=>x.s).join(' ')).width;let x=W/2-tw/2;
    for(const w of r){const on=t>=w.t;const pop=on?eo(cl((t-w.t)/0.12)):0;const ww=ctx.measureText(w.s+' ').width;
      ctx.save();ctx.translate(x+ctx.measureText(w.s).width/2,y0+ri*82);ctx.scale(1+0.08*(1-pop)*(on?1:0),1);
      ctx.lineWidth=14;ctx.strokeStyle='rgba(10,8,30,0.85)';ctx.lineJoin='round';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeText(w.s,0,0);ctx.fillStyle=on?(idx===lastOn?C.yel:C.ink):'rgba(246,241,231,0.35)';ctx.fillText(w.s,0,0);ctx.restore();x+=ww;idx++;}});
}
window.setupSync=(v,words,dur)=>{const L=VIDS[v].lines;let k=0;const map=[];
  L.forEach((l,i)=>{const n=l[2].split(' ').length;map.push([i?words[k].start-0.05:0,l[0]]);k+=n;});
  map.push([dur,VIDS[v].dur]);
  window.SYNC={on:true,words:chunksFrom(words,L),map,tv:0};return map.length;};
window.grabSync=(v,tv)=>{const m=SYNC.map;let ta=VIDS[v].dur;
  for(let i=0;i<m.length-1;i++){if(tv>=m[i][0]&&tv<m[i+1][0]){ta=m[i][1]+(tv-m[i][0])/(m[i+1][0]-m[i][0])*(m[i+1][1]-m[i][1]);break;}}
  SYNC.tv=tv;TALK=(SYNC.env&&SYNC.env[Math.round(tv*30)])||0;VIDS[v].draw(Math.min(ta,VIDS[v].dur-0.001));return cv.toDataURL('image/jpeg',0.92);};
</script></body></html>
