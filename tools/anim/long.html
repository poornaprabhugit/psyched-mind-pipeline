<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>

<script src="helpers.js"></script>
<script>
// ================= long-video framework =================
let CH=0, WORDS=[], DUR=0, TRICKS_BEFORE=0;
const norm=s=>s.toLowerCase().replace(/[^a-z0-9$%-]/g,'');
// time of the n-th occurrence of a word (or first word of a phrase)
function A(phrase,occ=1){const ps=phrase.split(' ').map(norm);let c=0;
  for(let i=0;i<WORDS.length;i++){let ok=true;for(let j=0;j<ps.length;j++){if(!WORDS[i+j]||norm(WORDS[i+j].w)!==ps[j]){ok=false;break;}}
    if(ok){c++;if(c===occ)return WORDS[i].start;}}
  console.log('MISSING',CH,phrase);return 1e9;}
const L=(t,a,d=0.4)=>eo(cl((t-a)/d));          // ease-in from time a over d seconds
const between=(t,a,b)=>t>=a&&t<b;
function sky(night){const g=ctx.createLinearGradient(0,0,0,H);
  if(night){g.addColorStop(0,'#0E0C26');g.addColorStop(1,'#17143A');}else{g.addColorStop(0,C.bg2);g.addColorStop(1,C.bg);}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(0,GROUND,W,6);}
function chapterLabel(txt_){ctx.save();ctx.globalAlpha=0.75;ctx.font=`bold 30px ${F}`;const w=ctx.measureText(txt_).width;
  ctx.fillStyle='rgba(255,255,255,0.08)';rr(40,34,w+44,56,28);ctx.fill();txt(txt_,62,63,30,C.ink,'left','bold');ctx.restore();}
let COUNTER=null;function counter(n,pop){COUNTER=[n,pop];}
function drawCounter(n,pop){ctx.save();const x=W-250,y=36;ctx.translate(x+105,y+30);const s=1+0.25*pop;ctx.scale(s,s);ctx.translate(-(x+105),-(y+30));
  ctx.fillStyle='rgba(255,255,255,0.1)';rr(x,y,210,60,30);ctx.fill();txt('TRICKS',x+70,y+31,24,C.dim,'center','bold');
  txt(n+'/8',x+160,y+31,32,pop>0.01?C.yel:C.ink,'center','900');ctx.restore();}
function bigNote(x,y,rot,s,text,col='#FFE27A'){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.fillStyle=col;ctx.fillRect(-90,-70,180,140);ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(-90,-70,180,22);
  ctx.font=`900 30px ${F}`;ctx.fillStyle='#3A2A10';ctx.textAlign='center';ctx.textBaseline='middle';
  text.split('\n').forEach((l,i,a)=>ctx.fillText(l,0,10+(i-(a.length-1)/2)*36));ctx.restore();}
function wallet(x,y,s,open=0,bills=0){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  for(let i=0;i<bills;i++){bill(-10+i*6,-50-i*5,-0.1+i*0.05,0.8);}
  ctx.fillStyle='#8A5A3B';rr(-110,-60,220,130,16);ctx.fill();ctx.fillStyle='#6b4229';
  ctx.save();ctx.translate(0,-60);ctx.rotate(-1.3*open);rr(-110,-90,220,90,16);ctx.fill();ctx.restore();
  ctx.fillStyle='#C9A27E';ctx.beginPath();ctx.arc(80,5,10,0,7);ctx.fill();ctx.restore();}
function cup(x,y,s,steam=0){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#F6F1E7';
  ctx.beginPath();ctx.moveTo(-40,-60);ctx.lineTo(40,-60);ctx.lineTo(30,30);ctx.lineTo(-30,30);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8A5A3B';ctx.fillRect(-42,-72,84,16);ctx.fillStyle=C.cor;ctx.fillRect(-36,-25,72,20);
  if(steam>0){ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=5;ctx.lineCap='round';for(let i=-1;i<=1;i++){ctx.beginPath();
    for(let k=0;k<=10;k++){const yy=-80-k*6;const xx=i*18+Math.sin(k*0.8+steam*4+i)*6;k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();}}
  ctx.restore();}
function stampCard(x,y,s,slots,filled,hl=0,label){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  const cols=5,rows=Math.ceil(slots/cols),w=cols*70+40,h=rows*70+90;
  ctx.fillStyle='#FFF6E8';rr(-w/2,-h/2,w,h,20);ctx.fill();if(label)txt(label,0,-h/2+34,30,'#5A3A20','center','900');
  for(let i=0;i<slots;i++){const r=Math.floor(i/cols),c=i%cols;const cx=-w/2+55+c*70,cy=-h/2+90+r*70;
    ctx.strokeStyle='#C9A27E';ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,24,0,7);ctx.stroke();
    if(i<filled){ctx.fillStyle=C.cor;ctx.beginPath();ctx.arc(cx,cy,20,0,7);ctx.fill();txt('★',cx,cy+2,24,'#fff');}
    else if(hl>0){ctx.fillStyle=`rgba(255,201,77,${0.35*hl})`;ctx.beginPath();ctx.arc(cx,cy,20,0,7);ctx.fill();}}
  ctx.restore();}
function sparkle(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.rotate(t*2);ctx.scale(s*(0.8+0.2*Math.sin(t*9)),s*(0.8+0.2*Math.sin(t*9)));
  ctx.fillStyle=C.yel;ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?10:30,a=i*Math.PI/4;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.restore();}
function hbar(x,y,w,frac,col,label,val,k){txt(label,x,y-34,30,C.ink,'left','bold');
  ctx.fillStyle='rgba(255,255,255,0.1)';rr(x,y,w,44,22);ctx.fill();ctx.fillStyle=col;rr(x,y,Math.max(44,w*frac*k),44,22);ctx.fill();
  if(k>0.2)txt(val,x+Math.max(44,w*frac*k)+20,y+23,32,col,'left','900');}
function panel(x,y,w,h){ctx.fillStyle='rgba(255,255,255,0.06)';rr(x,y,w,h,30);ctx.fill();}
function title(t0,t,text,sub,hold=4.5){const k=Math.min(L(t,t0,0.5),1-L(t,t0+hold,0.5));if(k<=0)return;ctx.save();ctx.globalAlpha=k;
  ctx.fillStyle='rgba(10,8,30,0.82)';ctx.fillRect(0,0,W,H);ctx.translate(W/2,H/2-30);ctx.scale(mix(0.9,1,k),mix(0.9,1,k));
  txt(text,0,0,70,C.ink,'center','900');if(sub)txt(sub,0,90,40,C.yel,'center','bold');ctx.restore();}

// ================= chapters =================
const CHAPTERS=[];
// ---- 0: cold open ----
CHAPTERS[0]={label:'Saturday morning',draw(t){
  sky(false);
  const tFifty=A('fifty dollars'),tWrite=A('writes it down'),tStick=A('sticks the note'),tTonight=A('by tonight'),
        tFine=A('pip will feel fine'),tSmart=A("he'll feel smart"),tEight=A('eight times'),tGame=A("so here's the game"),tCount=A('keep count');
  // window + sun
  ctx.fillStyle='#2C2766';rr(1380,160,360,300,20);ctx.fill();ctx.fillStyle='#FFD27A';ctx.beginPath();ctx.arc(1560,300,60+Math.sin(t)*4,0,7);ctx.fill();
  ctx.strokeStyle=C.bg;ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(1560,160);ctx.lineTo(1560,460);ctx.moveTo(1380,310);ctx.lineTo(1740,310);ctx.stroke();
  // bed (only before he gets up)
  const up=L(t,1.2,0.6);
  ctx.fillStyle='#3A3378';rr(200,760,620,140,20);ctx.fill();ctx.fillStyle='#F6F1E7';rr(220,720,160,70,30);ctx.fill();
  const px=mix(420,760,up),py=mix(830,GROUND,up);
  // wallet on table
  ctx.fillStyle='#3A3378';rr(1000,760,380,30,10);ctx.fill();ctx.fillRect(1040,790,20,110);ctx.fillRect(1320,790,20,110);
  const empty=L(t,tTonight,2.2);
  const nBills=t<tFifty?0:Math.round(5*(1-empty));
  // bills fly away at "by tonight"
  if(t>tTonight)for(let i=0;i<5;i++){const k=cl((t-tTonight-i*0.3)/1.4);if(k>0&&k<1)bill(1190+k*600+i*20,690-k*500+Math.sin(k*9+i)*40,k*6,0.7);}
  wallet(1190,700,0.9,t>tFifty&&t<tStick?0.7:0,nBills);
  // sticky note
  if(t>tWrite){const st=L(t,tStick,0.5);bigNote(mix(900,1190,st),mix(520,640,st),mix(-0.15,0.08,st),mix(1.1,0.55,st),'SPEND\nNOTHING');}
  // Pip
  let mood='calm',arms=[0.35,-0.35],look=0.6;
  if(t<1.2){mood='meh';look=0;} else if(between(t,tFifty,tWrite)){mood='happy';arms=[0.35,-2.4];}
  if(t>tTonight&&t<tFine){mood='shock';arms=[1.6,-1.6];}
  if(t>tFine&&t<tEight){mood='happy';arms=[0.35,-2.9];look=0;}
  if(t>tEight&&t<tGame){mood='shock';look=0;}
  ctx.save();if(up<1){ctx.translate(px,py);ctx.rotate(-1.2*(1-up));ctx.translate(-px,-py);}
  pip({x:px,y:py,s:1.25,col:C.blu,mood,arms,look,blink:t>0.3&&t<0.45||Math.abs(t-tSmart-0.5)<0.07});ctx.restore();
  // "smart" glasses gag
  if(t>tSmart&&t<tEight){const k=L(t,tSmart,0.3);ctx.save();ctx.globalAlpha=k;ctx.fillStyle='#111';rr(px-75,py-310*1.25+0+60,60,26,8);ctx.fill();rr(px+15,py-310*1.25+60,60,26,8);ctx.fill();ctx.fillRect(px-15,py-310*1.25+68,30,8);ctx.restore();}
  // eight question marks
  if(t>tEight&&t<tGame+0.6){for(let i=0;i<8;i++){const k=back(cl((t-tEight-i*0.12)/0.4));if(k<=0)continue;
    txt('?',360+i*170,260+Math.sin(t*3+i)*12,90*k,i%2?C.yel:C.cor,'center','900');}}
  title(tGame,t,'Why You Waste Money Without Noticing','8 tricks · 1 day · real studies');
  if(t>tCount)counter(0,0);
}};
// ---- 1: free stamps ----
CHAPTERS[1]={label:'1 · The free stamps',trick:1,draw(t){
  sky(false);
  const tCard=A('loyalty card'),tTwo=A('two stamps are already'),tRes=A('researchers tested'),tSame=A('the same eight more'),
        tTwice=A('almost twice as often'),tOnly=A('the only thing that changed'),tEvery=A('you see this everywhere'),
        tSecond=A('orders a second coffee'),tTrick=A('trick number one');
  const study=t>tRes&&t<tEvery, every=t>tEvery&&t<tSecond;
  if(!study&&!every){
    // café: counter + barista
    ctx.fillStyle='#3A3378';rr(1100,640,640,260,20);ctx.fill();ctx.fillStyle=C.cor;rr(1080,600,680,60,20);ctx.fill();
    txt('COFFEE',1420,632,34,'#fff','center','900');
    pip({x:1450,y:640,s:0.95,col:C.pnk,mood:'happy',arms:t>tCard&&t<tRes?[0.35,-1.4]:[0.35,-0.35],look:-0.6,blink:Math.abs((t%4)-2)<0.06});
    const wk=L(t,0,2.2);const px=mix(200,820,wk);
    const two=t>tSecond;
    pip({x:px+(two&&t>tSecond+0.6?Math.sin(t*70)*7:0),y:GROUND,s:1.25,col:C.blu,mood:two?(t>tSecond+0.6?'shock':'happy'):(t>tTwo?'happy':'calm'),arms:two?[1.2,-1.2]:[0.35,-0.35],look:two&&t>tSecond+0.6?0:0.6,walk:wk>0&&wk<1?t*1.6:null,blink:Math.abs((t%3.7)-1.8)<0.06});
    if(!two)cup(1300,590,0.8,t);
    else{cup(px-170,640,0.7,t);cup(px+170,640,0.7,t);sparkle(px,300,1,t);}
    if(t>tCard&&t<tRes){const k=back(cl((t-tCard)/0.5));stampCard(960,330,0.9*k,10,t>tTwo?2:0,0,'FREE COFFEE CARD');
      if(t>tTwo){sparkle(960-175+55,330-0.9*0+0,0.8,t);}}
  } else if(study){
    // two cards side by side
    const k1=L(t,tRes,0.5),k2=L(t,tRes+1.2,0.5);const hl=t>tSame?0.6+0.4*Math.sin(t*6):0;
    panel(160,150,740,640);panel(1020,150,740,640);
    txt('Card A',530,210,40,C.ink,'center','900');txt('Card B',1390,210,40,C.ink,'center','900');
    if(k1>0)stampCard(530,420,0.95*k1,8,0,hl,'8 stamps needed');
    if(k2>0)stampCard(1390,450,0.95*k2,10,2,hl,'10 stamps · 2 free');
    if(t>tSame){txt('Same 8 left to buy',W/2,860,44,C.yel,'center','900');}
    if(t>tTwice){const k=L(t,tTwice,1.0);
      ctx.save();ctx.fillStyle='rgba(10,8,30,0.97)';ctx.fillRect(0,0,W,H);ctx.restore();
      txt('Cards finished',W/2,300,48,C.ink,'center','900');
      hbar(460,440,1000,0.5,C.dim,'Card A (8 needed)','1×',k);
      hbar(460,620,1000,1.0,C.grn,'Card B (2 already stamped)','almost 2×',k);
      if(t>tOnly)txt('Only the head start changed.',W/2,850,44,C.yel,'center','900');}
  } else {
    // everywhere examples
    const k=L(t,tEvery,0.5);
    panel(260,200,1400,560);
    txt('PROGRESS',420,300,34,C.dim,'left','bold');
    ctx.fillStyle='rgba(255,255,255,0.12)';rr(420,330,1080,50,25);ctx.fill();ctx.fillStyle=C.grn;rr(420,330,1080*(0.2+0.1*Math.min(1,(t-tEvery)/3)),50,25);ctx.fill();
    txt('20%',1540,356,34,C.grn,'left','900');
    if(t>A('apps that tell')){const kk=back(cl((t-A('apps that tell'))/0.4));ctx.save();ctx.translate(960,500);ctx.scale(kk,kk);
      ctx.fillStyle='#fff';rr(-330,-50,660,100,50);ctx.fill();txt('Profile 90% complete!',0,2,40,'#17143A','center','900');ctx.restore();}
    if(t>A('rewards cards')){const kk=back(cl((t-A('rewards cards'))/0.4));stampCard(960,680,0.5*kk,10,2,0,'');}
  }
  counter(t>tTrick?1:0,t>tTrick?Math.max(0,1-(t-tTrick)/0.6):0);
}};

// ---------- extra props ----------
function heartEyes(x,y,s){for(const d of [-1,1]){ctx.save();ctx.translate(x+d*28*s,y-222*s);ctx.scale(s*1.1,s*1.1);ctx.fillStyle=C.cor;
  ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-26,-8,-12,-26,0,-12);ctx.bezierCurveTo(12,-26,26,-8,0,10);ctx.fill();ctx.restore();}}
function bubble(x,y,w,h,tailx,taily){ctx.fillStyle='#fff';rr(x,y,w,h,40);ctx.fill();ctx.beginPath();ctx.arc(tailx,taily,14,0,7);ctx.arc(tailx-30,taily+40,9,0,7);ctx.fill();}
function gymBuilding(x){ctx.fillStyle='#3A3378';rr(x,420,520,480,16);ctx.fill();ctx.fillStyle=C.cor;rr(x-20,380,560,80,16);ctx.fill();
  txt('GYM',x+260,422,50,'#fff','center','900');ctx.fillStyle='#1a1630';rr(x+190,700,140,200,10);ctx.fill();
  ctx.fillStyle='#5a4fb0';rr(x+150,890,220,14,6);ctx.fill();}
function dumbbell(x,y,s,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.fillStyle='#555';ctx.fillRect(-60,-6,120,12);
  ctx.fillStyle='#222';rr(-80,-30,24,60,6);ctx.fill();rr(56,-30,24,60,6);ctx.fill();ctx.restore();}
function people(x,y,cols,rows,lit,col,size=34,gap=12){for(let i=0;i<cols*rows;i++){const r=Math.floor(i/cols),c=i%cols;
  ctx.fillStyle=i<lit?col:'rgba(255,255,255,0.15)';const px=x+c*(size+gap),py=y+r*(size+gap);
  ctx.beginPath();ctx.arc(px+size/2,py+size*0.28,size*0.22,0,7);ctx.fill();rr(px+size*0.18,py+size*0.5,size*0.64,size*0.5,size*0.25);ctx.fill();}}
function card(x,y,w,h,col){ctx.fillStyle=col||'rgba(255,255,255,0.08)';rr(x,y,w,h,24);ctx.fill();}
function phone(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#111';rr(-230,-400,460,800,50);ctx.fill();
  ctx.fillStyle='#F6F1E7';rr(-205,-370,410,740,30);ctx.fill();ctx.restore();}
function tripCard(x,y,s,name,price,col,heart){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=col;rr(-170,-110,340,220,24);ctx.fill();
  txt(name,0,-50,44,'#fff','center','900');txt(price,0,30,64,'#fff','center','900');if(heart){ctx.fillStyle='#fff';txt('♥ more fun',0,86,30,'#fff','center','bold');}ctx.restore();}
function jacket(x,y,s,col='#3DB2DC'){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(-60,-120);ctx.lineTo(60,-120);ctx.lineTo(120,-60);ctx.lineTo(95,-20);ctx.lineTo(70,-50);ctx.lineTo(70,120);ctx.lineTo(-70,120);ctx.lineTo(-70,-50);ctx.lineTo(-95,-20);ctx.lineTo(-120,-60);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,-120);ctx.lineTo(0,120);ctx.stroke();
  ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(0,-150,14,Math.PI,0);ctx.lineWidth=5;ctx.strokeStyle='#ccc';ctx.stroke();ctx.restore();}
function snowCloud(x,y,t){ctx.fillStyle='#B9B4E0';for(const [dx,r] of [[-40,34],[0,46],[44,34]]){ctx.beginPath();ctx.arc(x+dx,y,r,0,7);ctx.fill();}
  ctx.fillStyle='#fff';for(let i=0;i<6;i++){const fy=(t*120+i*37)%160;ctx.beginPath();ctx.arc(x-50+i*20,y+40+fy,5,0,7);ctx.fill();}}
function badge(x,y,text,col,k){if(k<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(-0.06);ctx.scale(back(k),back(k));ctx.font=`900 44px ${F}`;
  const w=ctx.measureText(text).width;ctx.fillStyle=col;rr(-w/2-30,-44,w+60,88,44);ctx.fill();txt(text,0,2,44,'#17143A','center','900');ctx.restore();}
function cnt(t,n,tT){counter(t>tT?n:n-1,t>tT?Math.max(0,1-(t-tT)/0.6):0);}

// ---- 2: gym ----
CHAPTERS[2]={label:'2 · The gym',draw(t){
  sky(false);
  const tTwice=A("he's been twice"),tNext=A("next month's pip"),tStudy=A('a study looked'),tSeven=A('over seventy dollars'),tSev=A('more than seventeen'),
        tPass=A('the same gym sold'),tEighty=A('about eighty percent'),tChose=A('they chose the monthly'),tTrickL=A("and that's the trick"),tWave=A('pip waves'),tT=A('trick number two');
  const study=t>tStudy&&t<tChose;
  if(!study){
    gymBuilding(1180);
    const wk=L(t,0,2.4);let px=mix(180,780,wk);
    const fall=L(t,tWave+1.2,0.35);
    let arms=[0.35,-0.35],mood='calm';if(t>tWave&&t<tWave+1.2){arms=[0.35,-2.6+Math.sin(t*12)*0.3];mood='happy';}
    if(fall>0){mood='shock';arms=[1.8,-1.8];}
    if(t>tTwice&&t<tStudy){mood='meh';}
    ctx.save();if(fall>0){ctx.translate(px,GROUND);ctx.rotate(-1.4*fall);ctx.translate(-px,-GROUND);}
    pip({x:px,y:GROUND,s:1.25,col:C.blu,mood,arms,look:0.7,walk:wk>0&&wk<1?t*1.6:null,blink:Math.abs((t%3.9)-2)<0.06});ctx.restore();
    if(t>tTwice&&t<tStudy){const k=back(cl((t-tTwice)/0.4));ctx.save();ctx.translate(400,330);ctx.scale(k,k);card(-200,-150,400,300,'#F6F1E7');
      txt('THIS MONTH',0,-110,30,'#17143A','center','900');for(let i=0;i<30;i++){const r=Math.floor(i/6),c=i%6;ctx.strokeStyle='#bbb';ctx.lineWidth=2;ctx.strokeRect(-165+c*55,-80+r*42,48,36);
        if(i===4||i===17){txt('✓',-165+c*55+24,-80+r*42+20,30,C.grn,'center','900');}}ctx.restore();}
    if(t>tNext&&t<tStudy+0.1||t>tChose&&t<tWave){bubble(820,150,420,330,830,520);
      pip({x:1030,y:450,s:0.8+0.06*Math.sin(t*3),col:'#5A62E0',mood:'happy',arms:[0.35,-3.0],look:0});dumbbell(1030+0,450-300*0.8-70,0.9,Math.sin(t*3)*0.1);
      txt('next month',1030,190,30,'#17143A','center','900');}
  } else {
    card(120,140,820,760);card(980,140,820,760);
    txt('~7,750 gym members',530,210,40,C.ink,'center','900');
    people(200,280,16,8,t>tSeven?128:0,C.blu,30,10);
    if(t>tSeven){const k=L(t,tSeven,0.5);ctx.globalAlpha=k;txt('Monthly plan',1390,230,40,C.ink,'center','900');
      txt('$70+ a month',1390,320,56,C.yel,'center','900');txt('÷ about 4 visits',1390,400,44,C.ink,'center','bold');ctx.globalAlpha=1;}
    if(t>tSev){badge(1390,510,'= $17+ per visit',C.cor,L(t,tSev,0.4));}
    if(t>tPass){const k=L(t,tPass,0.4);ctx.globalAlpha=k;txt('10-visit pass',1390,630,40,C.ink,'center','900');badge(1390,720,'$10 per visit',C.grn,k);ctx.globalAlpha=1;}

// ================= API =================
const EMPH=/^(\d|one|two|three|four|five|six|seven|eight|nine|ten|twelve|fifteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|hundred|thousand|free|gone|twice|half|same|never|every|only|empty|nobody|almost|more)/;
function makeBeats(){const kinds=['point','up','nod','shrug','count'];const out=[];let last=-9;
  WORDS.forEach((w,i)=>{const x=norm(w.w);if(EMPH.test(x)&&w.start-last>1.6){out.push({t:w.start,kind:/^\d|percent|dollar/.test(x)||/(ty|teen|hundred|thousand)/.test(x)?(out.length%2?'up':'point'):kinds[out.length%kinds.length]});last=w.start;}});
  // idle filler: a small gesture every ~4 s where nothing else happens
  for(let t=2;t<DUR-1;t+=4.3){if(!out.some(b=>Math.abs(b.t-t)<2))out.push({t,kind:['nod','point','shrug'][Math.floor(t)%3]});}
  return out.sort((a,b)=>a.t-b.t);}
window.setChapter=(n,words,dur)=>{CH=n;WORDS=words;DUR=dur;BEATS=makeBeats();return BEATS.length;};
function camAt(c,t){let z=1.03+0.025*Math.sin(t*0.21),cx=W/2+60*Math.sin(t*0.13),cy=H/2+20*Math.sin(t*0.17);if(c.cam)for(const [a,d,zz,x,y] of c.cam()){const k=Math.min(L(t,a,0.5),1-L(t,a+d,0.6));if(k>0){z=mix(z,zz,k);cx=mix(cx,x,k);cy=mix(cy,y,k);}}return [z,cx,cy];}
window.sfxList=()=>{const c=CHAPTERS[CH];return c.sfx?c.sfx():[];};
window.frame=(t)=>{NOW=t;MAIN_DRAWN=false;const c=CHAPTERS[CH];COUNTER=null;const [z,cx,cy]=camAt(c,t);ctx.save();ctx.translate(cx,cy);ctx.scale(z,z);ctx.translate(-cx,-cy);
  c.draw(t);if(c.gag)c.gag(t);ctx.restore();
  if(CH>0&&!MAIN_DRAWN){pip({x:150,y:1075,s:0.8,col:C.blu,mood:'calm',arms:[0.35,-0.35],look:0.9});MAIN_DRAWN=false;}if(COUNTER)drawCounter(COUNTER[0],COUNTER[1]);if(CH>0)chapterLabel(c.label);
  // fade in/out between chapters
  const f=Math.min(cl(t/0.3),cl((DUR-t)/0.3));if(f<1){ctx.fillStyle=`rgba(10,8,30,${1-f})`;ctx.fillRect(0,0,W,H);}
  return cv.toDataURL('image/jpeg',0.9);};
